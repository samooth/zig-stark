name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build, fmt, test (Zig 0.16.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig build fmt

      - name: Build all examples and benchmarks
        run: zig build

      - name: Run unit and e2e tests
        run: zig build test

      - name: Run tests in ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

  wasm:
    name: wasm C ABI (wasm32-freestanding) + Node smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the wasm C-ABI module
        run: zig build wasm -Doptimize=ReleaseSmall

      - name: Refresh the packaged wasm and run the Node smoke test
        run: |
          cp zig-out/bin/zig_stark_capi.wasm bindings/js/zig_stark_capi.wasm
          node bindings/js/test/smoke.mjs

  fuzz:
    name: gadget fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Run randomized gadget fuzz
        run: zig build fuzz